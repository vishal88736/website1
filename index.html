    <meta name="theme-color" content="#101316" />
    <script>
      var view =
        new URLSearchParams(window.location.search).get("view") === "recruiter"
          ? "recruiter"
          : "explore";
      document.documentElement.dataset.view = view;
      try {
        var t = localStorage.getItem("va-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = t;
        var palette = localStorage.getItem("va-palette");
        var palettes = ["volt", "lavender", "ocean", "sage", "rose", "amber"];
        if (palettes.indexOf(palette) === -1) palette = "volt";
        document.documentElement.dataset.palette = palette;
        var bootBg =
          view === "recruiter"
            ? "#fafafa"
            : t === "light"
              ? "#f4f5f0"
              : "#101316";
        document.documentElement.style.setProperty("--boot-bg", bootBg);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = bootBg;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.palette = "volt";
        document.documentElement.style.setProperty(
          "--boot-bg",
          view === "recruiter" ? "#fafafa" : "#101316",
        );
      }
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {

        width: 100%;
        min-height: 100vh;
        background-color: var(--boot-bg, #101316);
