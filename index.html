    <meta name="theme-color" content="#17130f" />
    <script>
      try {
        var t = localStorage.getItem("va-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = t;
        var palette = localStorage.getItem("va-palette");
        var palettes = ["ember", "lavender", "ocean", "sage", "rose", "amber"];
        if (palettes.indexOf(palette) === -1) palette = "ember";
        document.documentElement.dataset.palette = palette;
        var bootBg = palette === "ember"
          ? (t === "light" ? "#f7f1e8" : "#17130f")
          : (t === "light" ? "#f7f6f2" : "#101113");
        document.documentElement.style.setProperty("--boot-bg", bootBg);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = bootBg;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.palette = "ember";
      }
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: var(--boot-bg, #17130f);
